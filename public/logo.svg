<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none">
  <!-- Cat Face Stencil -->
  <g transform="translate(150, 70)" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Head & Ears -->
    <path d="M -45 -25 L -35 -55 L -12 -35 C -4 -38 4 -38 12 -35 L 35 -55 L 45 -25 C 55 -10 58 10 52 28 C 45 45 25 55 0 55 C -25 55 -45 45 -52 28 C -58 10 -55 -10 -45 -25 Z" />
    
    <!-- Inner Ears -->
    <path d="M -30 -30 L -25 -42 L -18 -32" stroke-width="4"/>
    <path d="M 30 -30 L 25 -42 L 18 -32" stroke-width="4"/>
    
    <!-- Eyes (Squinting/Happy arcs) -->
    <path d="M -25 -10 Q -18 -18 -10 -10" stroke-width="5"/>
    <path d="M 10 -10 Q 18 -18 25 -10" stroke-width="5"/>
    
    <!-- Nose & Open Meow Mouth -->
    <path d="M -5 2 L 0 -2 L 5 2 Z" fill="currentColor"/>
    <path d="M -16 10 Q 0 30 16 10 Q 0 5 -16 10 Z" fill="currentColor"/>
    
    <!-- Whiskers Left -->
    <path d="M -48 -5 L -68 -10" stroke-width="4"/>
    <path d="M -50 8 L -72 8" stroke-width="4"/>
    <path d="M -48 20 L -68 25" stroke-width="4"/>
    
    <!-- Whiskers Right -->
    <path d="M 48 -5 L 68 -10" stroke-width="4"/>
    <path d="M 50 8 L 72 8" stroke-width="4"/>
    <path d="M 48 20 L 68 25" stroke-width="4"/>
  </g>
  
  <!-- Fitcat Wordmark -->
  <text x="150" y="180" text-anchor="middle" fill="currentColor" font-family="'Outfit', 'Fredoka', 'Quicksand', sans-serif" font-weight="900" font-size="44" letter-spacing="-1">fitcat</text>
  <!-- Tagline -->
  <text x="150" y="208" text-anchor="middle" fill="currentColor" font-family="Georgia, serif" font-style="italic" font-size="16" letter-spacing="0.5">It's meow or never</text>
</svg>
